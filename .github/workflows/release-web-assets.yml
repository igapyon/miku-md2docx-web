name: Release Web Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-web-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build:all

      - name: Stage Web release assets
        run: npm run stage:web-release

      - name: Upload Web release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
